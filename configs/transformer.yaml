experiment_name: sleep-eeg
run_name: transformer-run1

data:
  processed_dir: data/processed

model:
  name: SleepTransformer
  seq_len: 20           # 20 epochs = 10 minutes of sleep context
  stride: 1             # sliding window step (1 = fully overlapping, faster convergence)
  cnn_checkpoint: null  # set to path of best_model.pt to use pretrained CNN weights
  freeze_cnn: false     # true = only train transformer layers (faster, less data needed)
  d_model: 256          # must match CNN embedding size
  n_heads: 8
  n_layers: 3
  d_ff: 512
  dropout: 0.1
  n_classes: 5

training:
  epochs: 100
  batch_size: 32        # smaller than CNN because each sample is seq_len epochs
  lr: 0.0003
  weight_decay: 0.0001
  patience: 10
  num_workers: 4
  checkpoint_dir: checkpoints/transformer
